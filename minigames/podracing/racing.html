<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben Quadinaros Podracing</title>
    <link rel="stylesheet" href="racing.css">
</head>
<body>
    <audio id="raceAudio" src="../../assets/racing.wav" loop></audio>
    <div class="race-score" aria-live="polite">Score: <span id="raceScore">0</span></div>
    <div>
    <img class="pod" id = "pod" src="../../assets/bt310_quadra.png" alt="BT310 Quadra">
    <img class="ben" id = "ben" src="../../assets/ben.png" alt="Ben Quadinaros">
    </div>
    <img class="obstacle" id = "obstacle" src="../../assets/rock_spire.png" alt="Obstacle">
    <section class="game-over" id="gameOver" role="alertdialog" aria-labelledby="gameOverTitle" hidden>
        <h1 id="gameOverTitle">Race Over</h1>
        <p>Your pod hit an obstacle.</p>
        <button id="restartButton" type="button">Back to Menu</button>
    </section>
</body>
<script src="podracing.js"></script>
</html>
