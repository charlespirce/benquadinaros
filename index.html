<!DOCTYPE html>
<!-- Tells the browser "this is modern HTML". Always the first line. -->

<!-- lang="en" tells screen readers and translators the page is English. -->
<html lang="en">

<!-- <head> holds information ABOUT the page. Nothing here is visible. -->
<head>
    <!-- How the text is encoded. UTF-8 means accents and emoji work. -->
    <meta charset="utf-8">

    <!-- Makes the page scale properly on phones instead of zooming out. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <!-- The text shown in the browser tab. -->
    <title>Ben Quadinaros Clicker</title>

    <!-- Loads the stylesheet: everything about how the page LOOKS. -->
    <link rel="stylesheet" href="src/styles.css">

    <!-- Loads the game code: everything about how the page BEHAVES.
         `defer` means "download it now, but do not run it until the whole
         page has been read". That guarantees the empty <div>s below
         already exist by the time main.js goes looking for them, which is
         why the code can run at the top level without any setup wrapper. -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="src/main.js" defer></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/dvd-ben@1.0.0/dist/dvd_ben.min.js"></script>
</head>

<!-- <body> holds everything the user can actually see. -->
<body>

<!-- ===== THE TWO-COLUMN LAYOUT =====
     .layout is exactly as tall as the window and never scrolls itself.
     Instead, each of the two columns inside it scrolls on its own. That
     is what lets you scroll the shop without Ben moving at all. -->
<div class="layout">

    <!-- ---------- LEFT COLUMN: Ben and the numbers ---------- -->
    <!-- <main> means "the primary content". It behaves like a <div> but
         tells screen readers which part is the main event. -->
    <main class="stage-column">

        <!-- Static chrome: these never change while the game runs, so
             they are plain HTML rather than being built by main.js.
             `alt` is the text shown if an image fails to load, and what
             a screen reader announces. -->
        <img class="title" src="assets/ben_title.png" alt="Ben Quadinaros Clicker">
        <img class="title" src="assets/aurebesh_title.png" alt="Aurebesh title">

        <div id="clock-slot"></div>      <!-- Clock writes the time here -->
        <div id="readout-slot"></div>    <!-- "Total Clicks", "Per Click", "Rate" -->
        <div id="stage-slot"></div>      <!-- podrace background + the Ben image -->
    </main>

    <!-- ---------- RIGHT COLUMN: the shop ---------- -->
    <!-- <aside> means "related, but off to the side". Again it behaves
         like a <div>; the name is for screen readers and for whoever
         reads this file next. -->
    <aside class="shop-column">

        <!-- Section headings are static text, so they stay in the HTML;
             most buttons underneath are built by main.js. -->
        <h2 class="shop-heading">Click Power</h2>
        <div id="click-shop-slot"></div>   <!-- CLICK_UPGRADES -->

        <h2 class="shop-heading">Generators</h2>
        <div id="shop-slot"></div>         <!-- GENERATORS + the skin button -->
          <h2 class="shop-heading">Skins</h2>
          <div id="skin-shop-slot"></div>    <!-- the skin buttons -->
        <div id="controls-slot"></div>     <!-- the reset button -->
        <h2 class="minigames-heading">Minigames</h2>
            <div id="minigames-slot"></div>    <!-- the minigame buttons -->
        <h2 class="shop-heading">Wiki</h2>
        <a class="shop-button affordable wiki-button"
           href="https://github.com/charlespirce/benquadinaros/wiki"
           target="_blank" rel="noopener noreferrer">
            <img class="icon" src="assets/ben.png" alt="Wiki">
            <span>Wiki</span>
        </a>
          <h2 class="shop-heading">Welcome Email</h2>
          <div class="email-form">
               <p id="email-summary"></p>
               <button id="email-change" type="button">Change email</button>
          </div>
    </aside>

</div>

<!-- The email pop-up. <dialog> is hidden until main.js calls showModal().
     It asks once on first visit; "Change email" above reopens it. -->
<dialog id="email-dialog" class="email-dialog">
    <form id="welcome-email-form" class="email-form">
        <h2 class="shop-heading">Get a welcome email?</h2>
        <label for="welcome-email">Email address</label>
        <input id="welcome-email" name="email" type="email" autocomplete="email" required>
        <button type="submit">Save</button>
        <button id="email-dismiss" type="button">Not now</button>
        <p id="welcome-email-status" role="status" aria-live="polite"></p>
    </form>
</dialog>

<img id="dvd-ben" src="assets/gold_ben.png">

<script src="src/dvd_ben.js" ></script>

</body>
</html>
