<!DOCTYPE html>
<html>
<head>
<title>Ben Quadinaros Clicker</title>
</head>

<style>
    h1 {text-align: center;}
    body {text-align: center;}
</style>

<div> <img src="assets/ben_title.png" alt="Ben Title" style="width: 100%; max-width: 600px; height: auto;"> </div>
<div> <img src="assets/aurebesh_title.png" alt="Aurebesh Title" style="width: 95%; max-width: 600px; height: auto;"> </div>
<div id="clock">00:00:00</div>


<h1>
    Total Clicks: <span id="click-count">0</span>
</h1>

<h1>
    Rate: <span id="display-rate">0</span>
</h1>


<body style="background-color: rgb(5, 172, 238);">

<div style="text-align: center; background-image: url('podrace.png'); background-size: cover; background-position: center; min-height: 400px; padding: 20px;">
    <img id="ben-img" src="assets/ben.png" alt="Ben" width="399" height="501">
</div>
<div>
    <button id="rat_button" style="font-size: 24px; padding: 10px 20px; margin-top: 20px; display: inline-flex; align-items: center; gap: 10px;">
        <img src="assets/rattstyerell.png" alt="Ratts Tyerell" style="width: 40px; height: 40px; object-fit: cover; border-radius: 8px;">
        <span>Ratts Tyerell: <span id="rats-owned">0</span><span> Cost: <span id="rat-cost">20</span></span></span>
    </button>
</div>
</body>
<button id="polyben_button" style="font-size: 24px; padding: 10px 20px; margin-top: 20px; display: inline-flex; align-items: center; gap: 10px;">
    <img id="polyben_button_img" src="assets/benquad.png" alt="PolyBen" style="width: 40px; height: 40px; object-fit: cover; border-radius: 8px;">
    <span id="polyben-text">Unlock PolyBen - Cost: 1000</span>
</button>
<div>
    <button id="bt310quadra_button" style="font-size: 24px; padding: 10px 20px; margin-top: 20px; display: inline-flex; align-items: center; gap: 10px;">
        <img id="bt310quadra_button_img" src="assets/bt310_quadra.png" alt="BT-310 Quadra" style="width: 40px; height: 40px; object-fit: cover; border-radius: 8px;">
        <span id="bt310quadra-text">BT-310 Quadra: <span id="bt310quadra-owned">0</span> Cost: <span id="bt310quadra-cost">1500</span></span>
</div>
<button id="reset-clicks">
    <span>Reset</span>
</button> 

<script src="src/script.js"></script>
<script src="src/time.js"></script>
<script src="backgroundmusic.js"></script>


</html>
